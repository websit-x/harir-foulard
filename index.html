<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر حرير فولار | Harir Foulard</title>
    <!-- استدعاء خطوط أنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #faf8f5; /* لون خلفية ناعم جداً */
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        /* تصميم الشريط العلوي (الهيدر) */
        header {
            background-color: #d1bfae; /* لون يميل للبيج/الذهبي الهادئ */
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 1px;
        }
        header p {
            margin: 5px 0 0 0;
            font-size: 1.1em;
        }

        /* شبكة عرض المنتجات */
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* تصميم بطاقة المنتج */
        .product-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover; /* لضمان عدم تشوه الصورة */
            background-color: #eee;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 1.2em;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #444;
        }

        .product-price {
            font-size: 1.3em;
            color: #bfa894;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-button {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Cairo', sans-serif;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .buy-button:hover {
            background-color: #555;
        }

        /* حالة التحميل */
        #loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5em;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Harir Foulard</h1>
        <p>الأناقة والنعومة في كل تفصيلة 🧣</p>
    </header>

    <div id="loading">جاري ترتيب الفولارات... ⏳</div>
    
    <div class="products-container" id="products-list">
        <!-- ستظهر المنتجات هنا تلقائياً -->
    </div>

    <!-- استدعاء مكتبات فايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // مفاتيح مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyCXliqC63fmieXCsi1VrRsy0wmRtfV34EE",
            authDomain: "harir-foulard.firebaseapp.com",
            projectId: "harir-foulard",
            storageBucket: "harir-foulard.firebasestorage.app",
            messagingSenderId: "216589177776",
            appId: "1:216589177776:web:b5b25425b51f4c9932bc75"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const productsList = document.getElementById('products-list');
        const loadingDiv = document.getElementById('loading');

        // دالة لجلب المنتجات من قاعدة البيانات
        async function loadProducts() {
            try {
                // ترتيب المنتجات من الأحدث للأقدم
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                loadingDiv.style.display = 'none'; // إخفاء رسالة التحميل

                if (querySnapshot.empty) {
                    productsList.innerHTML = "<h3 style='grid-column: 1 / -1; text-align: center;'>لا توجد منتجات حالياً. قم بإضافة فولارات من لوحة التحكم!</h3>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    
                    // إنشاء بطاقة المنتج
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    card.innerHTML = `
                        <img src="${product.imageUrl}" alt="${product.name}" class="product-image">
                        <div class="product-info">
                            <h3 class="product-title">${product.name}</h3>
                            <div class="product-price">${product.price} د.ج</div>
                            <button class="buy-button" onclick="alert('سيتم برمجة سلة المشتريات لاحقاً!')">أضف إلى السلة</button>
                        </div>
                    `;
                    
                    productsList.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading products: ", error);
                loadingDiv.innerHTML = "حدث خطأ أثناء جلب المنتجات ❌";
            }
        }

        // تشغيل الدالة فور تحميل الصفحة
        window.onload = loadProducts;
    </script>
</body>
</html>
