<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم - Harir Foulard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .dashboard-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #d1bfae; /* لون أنيق يناسب الحرير */
            color: #333;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #bfa894;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>إضافة فولار جديد 🧣</h2>
        <form id="add-product-form">
            <div class="form-group">
                <label for="product-name">اسم أو موديل الفولار:</label>
                <input type="text" id="product-name" required placeholder="مثال: فولار حرير تركي أصلي">
            </div>
            
            <div class="form-group">
                <label for="product-price">السعر (دينار جزائري):</label>
                <input type="number" id="product-price" required placeholder="مثال: 1500">
            </div>

            <div class="form-group">
                <label for="product-image">صورة الفولار:</label>
                <input type="file" id="product-image" accept="image/*" required>
            </div>

            <button type="submit" id="submit-btn">رفع المنتج إلى المتجر</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- استدعاء مكتبات فايربيس (نسخة Modular الحديثة) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js";

        // مفاتيح مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyCXliqC63fmieXCsi1VrRsy0wmRtfV34EE",
            authDomain: "harir-foulard.firebaseapp.com",
            projectId: "harir-foulard",
            storageBucket: "harir-foulard.firebasestorage.app",
            messagingSenderId: "216589177776",
            appId: "1:216589177776:web:b5b25425b51f4c9932bc75"
        };

        // تهيئة فايربيس
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // التعامل مع زر الإضافة
        const form = document.getElementById('add-product-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // منع تحديث الصفحة
            
            // تعطيل الزر أثناء الرفع
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الرفع... الرجاء الانتظار ⏳";
            messageDiv.innerHTML = "";

            const name = document.getElementById('product-name').value;
            const price = document.getElementById('product-price').value;
            const file = document.getElementById('product-image').files[0];

            try {
                // 1. إنشاء مسار للصورة في Firebase Storage باسم فريد
                const storageRef = ref(storage, 'foulards_images/' + Date.now() + '_' + file.name);
                
                // 2. رفع الصورة
                const uploadResult = await uploadBytes(storageRef, file);
                
                // 3. جلب رابط الصورة بعد رفعها
                const imageUrl = await getDownloadURL(uploadResult.ref);

                // 4. حفظ بيانات المنتج (الاسم، السعر، ورابط الصورة) في Firestore
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    imageUrl: imageUrl,
                    createdAt: new Date()
                });

                // رسالة نجاح وتفريغ الحقول
                messageDiv.innerHTML = "<span class='success'>✅ تم إضافة المنتج بنجاح! سيظهر الآن في المتجر.</span>";
                form.reset();

            } catch (error) {
                console.error("Error adding product: ", error);
                messageDiv.innerHTML = "<span class='error'>❌ حدث خطأ أثناء الرفع: " + error.message + "</span>";
            } finally {
                // إعادة الزر لحالته الطبيعية
                submitBtn.disabled = false;
                submitBtn.innerText = "رفع المنتج إلى المتجر";
            }
        });
    </script>
</body>
</html>
