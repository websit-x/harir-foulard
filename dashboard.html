<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم - Harir Foulard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .dashboard-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #d1bfae; /* لون يتناسب مع ثيم المتجر */
            color: #333;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #bfa894;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>إضافة فولار جديد 🧣</h2>
        <form id="add-product-form">
            <div class="form-group">
                <label for="product-name">اسم أو موديل الفولار:</label>
                <input type="text" id="product-name" required placeholder="مثال: فولار حرير تركي أصلي">
            </div>
            
            <div class="form-group">
                <label for="product-price">السعر (دينار جزائري):</label>
                <input type="number" id="product-price" required placeholder="مثال: 1500">
            </div>

            <div class="form-group">
                <label for="product-image">صورة الفولار:</label>
                <input type="file" id="product-image" accept="image/*" required>
            </div>

            <button type="submit" id="submit-btn">رفع المنتج إلى المتجر</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- استدعاء مكتبات فايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // مفاتيح مشروعك في Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCXliqC63fmieXCsi1VrRsy0wmRtfV34EE",
            authDomain: "harir-foulard.firebaseapp.com",
            projectId: "harir-foulard",
            storageBucket: "harir-foulard.firebasestorage.app",
            messagingSenderId: "216589177776",
            appId: "1:216589177776:web:b5b25425b51f4c9932bc75"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('add-product-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');

        // دالة لضغط الصورة وتحويلها إلى نص (Base64) لتقليل حجمها قبل حفظها
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; // تصغير عرض الصورة لتقليل حجمها في قاعدة البيانات
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // ضغط الصورة وتوليد Base64 بنسبة جودة 0.7
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(compressedBase64);
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الرفع... الرجاء الانتظار ⏳";
            messageDiv.innerHTML = "";

            const name = document.getElementById('product-name').value;
            const price = document.getElementById('product-price').value;
            const file = document.getElementById('product-image').files[0];

            try {
                // 1. معالجة وضغط الصورة
                const imageBase64 = await compressImage(file);

                // 2. حفظ البيانات (الاسم، السعر، والصورة كنص) في Firestore
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    imageUrl: imageBase64,
                    createdAt: new Date()
                });

                messageDiv.innerHTML = "<span class='success'>✅ تم إضافة المنتج بنجاح!</span>";
                form.reset();

            } catch (error) {
                console.error("Error:", error);
                messageDiv.innerHTML = "<span class='error'>❌ حدث خطأ أثناء الحفظ: " + error.message + "</span>";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "رفع المنتج إلى المتجر";
            }
        });
    </script>
</body>
</html>
